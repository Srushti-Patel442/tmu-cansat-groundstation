<!DOCTYPE html>
<html>

<head>
    <title>TMU CanSat Telemetry Viewer</title>

    <!-- Plotly Chart Library -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- Custom Dashboard Styling -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Dashboard Header -->
    <h1>🚀 TMU CanSat Ground Station</h1>

    <!-- Mission Statistics Cards -->
    <div class="stats">

        <div class="card">
            <h3>Max Acceleration</h3>
            <p id="maxAccel">--</p>
        </div>

        <div class="card">
            <h3>Max Pressure</h3>
            <p id="maxPressure">--</p>
        </div>

        <div class="card">
            <h3>GPS Satellites</h3>
            <p id="gpsSats">--</p>
        </div>

        <div class="card">
            <h3>Current Altitude</h3>
            <p id="currentAltitude">--</p>
        </div>

        <div class="card">
            <h3>Samples</h3>
            <p id="sampleCount">--</p>
        </div>

        <div class="card">
            <h3>Flight Duration</h3>
            <p id="flightTime">--</p>
        </div>

    </div>

    <!-- Accelerometer Visualization -->
    <div class="chart-container">
        <div id="accelChart"></div>
    </div>

    <!-- Gyroscope Visualization -->
    <div class="chart-container">
        <div id="gyroChart"></div>
    </div>

    <!-- Pressure Visualization -->
    <div class="chart-container">
        <div id="pressureChart"></div>
    </div>

    <!-- Altitude Visualization -->
    <div class="chart-container">
        <div id="altitudeChart"></div>
    </div>

    <!-- Dashboard Logic -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
